<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — VentaXpress</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">🛒 Venta<span>Xpress</span></a>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<div class="breadcrumb">
  <a href="/">Inicio</a><span class="sep">›</span>
  <span>Crear cuenta</span>
</div>

<div class="form-page">
  <div class="form-card">
    <h1>✏️ Crear cuenta</h1>
    <p class="subtitle">Regístrate gratis y empieza a comprar en VentaXpress.</p>

    <div id="form-error" style="display:none;background:#FEE2E2;color:#991B1B;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.9rem;font-weight:600"></div>

    <form id="reg-form" novalidate>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div class="form-group" id="g-nombre">
          <label>Nombre</label>
          <input type="text" id="nombre" placeholder="Juan" required>
          <div class="error-msg">Requerido.</div>
        </div>
        <div class="form-group" id="g-apellido">
          <label>Apellido</label>
          <input type="text" id="apellido" placeholder="Pérez" required>
          <div class="error-msg">Requerido.</div>
        </div>
      </div>

      <div class="form-group" id="g-correo">
        <label>Correo electrónico</label>
        <input type="email" id="correo" placeholder="juan@ejemplo.com" required autocomplete="email">
        <div class="error-msg">Correo inválido.</div>
      </div>

      <div class="form-group" id="g-telefono">
        <label>Teléfono <span style="font-weight:400;opacity:.6">(opcional)</span></label>
        <input type="tel" id="telefono" placeholder="555-1234">
      </div>

      <div class="form-group" id="g-password">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
        <div class="error-msg">Mínimo 8 caracteres.</div>
      </div>

      <div class="form-group" id="g-confirm">
        <label>Confirmar contraseña</label>
        <input type="password" id="confirm" placeholder="Repite tu contraseña" required autocomplete="new-password">
        <div class="error-msg">Las contraseñas no coinciden.</div>
      </div>

      <!-- Captcha simplificado (desafío matemático) -->
      <div class="form-group" id="g-captcha">
        <label>Verificación humana 🤖</label>
        <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.4rem">
          <span id="captcha-question" style="font-weight:700;font-size:1rem;color:var(--navy)"></span>
          <input type="number" id="captcha-answer" placeholder="=" style="width:90px">
        </div>
        <div class="error-msg">Respuesta incorrecta.</div>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">
        Crear cuenta
      </button>
    </form>

    <div class="form-footer">
      ¿Ya tienes cuenta? <a href="/pages/login.html">Iniciar sesión →</a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const { Auth, post, toast } = window.VX;
  if (Auth.loggedIn) location.href = '/';

  // Generar captcha
  const a = Math.floor(Math.random()*10)+1;
  const b = Math.floor(Math.random()*10)+1;
  document.getElementById('captcha-question').textContent = `¿Cuánto es ${a} + ${b}?`;

  const errBox = document.getElementById('form-error');
  function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
  function hideErr()    { errBox.style.display = 'none'; }

  function setErr(gId, show) {
    document.getElementById(gId).classList.toggle('has-error', show);
  }

  function validate() {
    let ok = true;
    const nombre   = document.getElementById('nombre').value.trim();
    const apellido = document.getElementById('apellido').value.trim();
    const correo   = document.getElementById('correo').value.trim();
    const pwd      = document.getElementById('password').value;
    const conf     = document.getElementById('confirm').value;
    const cap      = Number(document.getElementById('captcha-answer').value);

    setErr('g-nombre',   !nombre);          if (!nombre) ok = false;
    setErr('g-apellido', !apellido);        if (!apellido) ok = false;
    setErr('g-correo',   !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo));
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) ok = false;
    setErr('g-password', pwd.length < 8);  if (pwd.length < 8) ok = false;
    setErr('g-confirm',  pwd !== conf);    if (pwd !== conf) ok = false;
    setErr('g-captcha',  cap !== a + b);   if (cap !== a + b) ok = false;
    return ok;
  }

  document.getElementById('reg-form').addEventListener('submit', async e => {
    e.preventDefault();
    hideErr();
    if (!validate()) return;

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = '⏳ Registrando...';

    try {
      const res = await post('/auth/registro', {
        nombre:   document.getElementById('nombre').value.trim(),
        apellido: document.getElementById('apellido').value.trim(),
        correo:   document.getElementById('correo').value.trim(),
        password: document.getElementById('password').value,
        telefono: document.getElementById('telefono').value.trim() || undefined
      });
      Auth.set(res.token, { nombre: document.getElementById('nombre').value, rol: 'cliente' });
      toast('🎉 Cuenta creada correctamente.');
      setTimeout(() => location.href = '/', 800);
    } catch (err) {
      showErr(err.message);
      btn.disabled = false;
      btn.textContent = 'Crear cuenta';
    }
  });
</script>
</body>
</html>
