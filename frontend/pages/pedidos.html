<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis pedidos — VentaXpress</title><link rel="stylesheet" href="/css/main.css"></head>
<body>
<nav class="navbar"><div class="nav-inner">
  <a href="/" class="nav-logo">🛒 Venta<span>Xpress</span></a>
  <div class="nav-links" id="nav-links"></div>
</div></nav>
<div class="breadcrumb"><a href="/">Inicio</a><span class="sep">›</span><span>Mis pedidos</span></div>
<div class="dashboard">
  <h1>📦 Mis pedidos</h1>
  <p class="welcome">Historial completo de tus compras.</p>
  <div class="panel">
    <div class="panel-header"><h2>Pedidos realizados</h2></div>
    <div class="panel-body" id="pedidos-wrap">⏳ Cargando...</div>
  </div>
</div>
<footer><p>© 2024 <strong>VentaXpress</strong></p></footer>
<script src="/js/app.js"></script>
<script>
  const { Auth, get, toast } = window.VX;
  if (!Auth.loggedIn) location.href = '/pages/login.html?redirect=/pages/pedidos.html';

  const estadoBadge = {
    pendiente:  'badge-pending',   confirmado: 'badge-confirmed',
    enviado:    'badge-shipped',   entregado:  'badge-delivered',
    cancelado:  'badge-cancelled'
  };

  async function load() {
    const wrap = document.getElementById('pedidos-wrap');
    try {
      const pedidos = await get('/pedidos/mis-pedidos');
      if (!pedidos.length) {
        wrap.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--text-muted)"><div style="font-size:3rem">📦</div><p>Aún no tienes pedidos.</p><a href="/" class="btn-primary" style="margin-top:1rem;display:inline-flex">Ver productos</a></div>';
        return;
      }
      wrap.innerHTML = pedidos.map(p => `
        <div style="border:1px solid var(--border);border-radius:10px;margin-bottom:1rem;overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;background:var(--bg);flex-wrap:wrap;gap:.5rem">
            <div>
              <strong>Pedido #${p.id}</strong>
              <span style="margin-left:.75rem;color:var(--text-muted);font-size:.85rem">${new Date(p.creado_en).toLocaleDateString('es-MX',{year:'numeric',month:'short',day:'numeric'})}</span>
            </div>
            <div style="display:flex;gap:.75rem;align-items:center">
              <span class="badge ${estadoBadge[p.estado]||''}">
                ${p.estado.charAt(0).toUpperCase()+p.estado.slice(1)}
              </span>
              <strong style="color:var(--navy);font-size:1.05rem">$${Number(p.total).toFixed(2)}</strong>
            </div>
          </div>
          <div style="padding:.85rem 1.25rem">
            ${(p.items||[]).map(it=>`
              <div style="display:flex;align-items:center;gap:.75rem;padding:.4rem 0;border-bottom:1px solid var(--border)">
                <span style="font-size:1.4rem">📦</span>
                <div style="flex:1">
                  <div style="font-weight:700;font-size:.9rem">${it.nombre}</div>
                  <div style="font-size:.82rem;color:var(--text-muted)">${it.cantidad} × $${Number(it.precio_unit).toFixed(2)}</div>
                </div>
                <div style="font-weight:700;color:var(--navy)">$${(it.cantidad*it.precio_unit).toFixed(2)}</div>
              </div>`).join('')}
          </div>
        </div>`).join('');
    } catch(err){ wrap.innerHTML = `<p style="color:var(--danger)">${err.message}</p>`; }
  }
  load();
</script>
</body></html>
