<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nueva contraseña — VentaXpress</title><link rel="stylesheet" href="/css/main.css"></head>
<body>
<nav class="navbar"><div class="nav-inner">
  <a href="/" class="nav-logo">🛒 Venta<span>Xpress</span></a>
</div></nav>

<div class="form-page">
  <div class="form-card">
    <h1>🔑 Nueva contraseña</h1>
    <p class="subtitle">Elige una contraseña segura para tu cuenta.</p>

    <div id="success-msg" style="display:none;background:#D1FAE5;color:#065F46;padding:1rem;border-radius:8px;margin-bottom:1rem;font-weight:600"></div>
    <div id="error-msg"   style="display:none;background:#FEE2E2;color:#991B1B;padding:.75rem;border-radius:8px;margin-bottom:1rem;font-weight:600"></div>

    <form id="np-form">
      <div class="form-group" id="g-nueva">
        <label>Nueva contraseña</label>
        <input type="password" id="nueva" placeholder="Mínimo 8 caracteres" required>
        <div class="error-msg">Mínimo 8 caracteres.</div>
      </div>
      <div class="form-group" id="g-conf">
        <label>Confirmar contraseña</label>
        <input type="password" id="confirmar" placeholder="Repite la contraseña" required>
        <div class="error-msg">Las contraseñas no coinciden.</div>
      </div>
      <button type="submit" class="btn-submit" id="btn-sub">Restablecer contraseña</button>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const { post, toast } = window.VX;
  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    document.getElementById('error-msg').textContent = 'Token inválido. Solicita un nuevo enlace.';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('np-form').style.display = 'none';
  }

  document.getElementById('np-form').addEventListener('submit', async e => {
    e.preventDefault();
    const nueva    = document.getElementById('nueva').value;
    const confirmar = document.getElementById('confirmar').value;
    const sucEl  = document.getElementById('success-msg');
    const errEl  = document.getElementById('error-msg');
    const btn    = document.getElementById('btn-sub');
    sucEl.style.display = errEl.style.display = 'none';

    let ok = true;
    if (nueva.length < 8) { document.getElementById('g-nueva').classList.add('has-error'); ok=false; }
    else document.getElementById('g-nueva').classList.remove('has-error');
    if (nueva !== confirmar) { document.getElementById('g-conf').classList.add('has-error'); ok=false; }
    else document.getElementById('g-conf').classList.remove('has-error');
    if (!ok) return;

    btn.disabled = true; btn.textContent = '⏳ Guardando...';
    try {
      const res = await post('/auth/restablecer', { token, password: nueva });
      sucEl.textContent = '✅ ' + res.mensaje + ' Redirigiendo...';
      sucEl.style.display = 'block';
      document.getElementById('np-form').style.display = 'none';
      setTimeout(() => location.href = '/pages/login.html', 2500);
    } catch(err) {
      errEl.textContent = err.message; errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Restablecer contraseña';
    }
  });
</script>
</body></html>
