<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis sesiones — VentaXpress</title><link rel="stylesheet" href="/css/main.css"></head>
<body>
<nav class="navbar"><div class="nav-inner">
  <a href="/" class="nav-logo">🛒 Venta<span>Xpress</span></a>
  <div class="nav-links" id="nav-links"></div>
</div></nav>
<div class="breadcrumb"><a href="/">Inicio</a><span class="sep">›</span><a href="/pages/perfil.html">Mi perfil</a><span class="sep">›</span><span>Sesiones</span></div>
<div class="dashboard">
  <h1>🔁 Sesiones activas</h1>
  <p class="welcome">Aquí puedes ver y cerrar todas las sesiones abiertas de tu cuenta.</p>
  <div class="panel" style="max-width:720px">
    <div class="panel-header"><h2>Dispositivos conectados</h2></div>
    <div class="panel-body" id="sesiones-wrap">⏳ Cargando...</div>
  </div>
</div>
<footer><p>© 2024 <strong>VentaXpress</strong></p></footer>
<script src="/js/app.js"></script>
<script>
  const { Auth, get, del, toast } = window.VX;
  if (!Auth.loggedIn) location.href = '/pages/login.html';

  async function load() {
    const wrap = document.getElementById('sesiones-wrap');
    try {
      const sesiones = await get('/auth/sesiones');
      if (!sesiones.length) {
        wrap.innerHTML = '<p style="color:var(--text-muted)">No hay sesiones activas.</p>'; return;
      }
      wrap.innerHTML = sesiones.map(s => `
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:.85rem 0;border-bottom:1px solid var(--border)">
          <div style="font-size:1.5rem">💻</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:.9rem;margin-bottom:.2rem">${s.dispositivo?.substring(0,80)||'Dispositivo desconocido'}</div>
            <div style="font-size:.8rem;color:var(--text-muted)">IP: ${s.ip||'—'} · Inicio: ${new Date(s.creado_en).toLocaleString('es-MX')} · Expira: ${new Date(s.expira_en).toLocaleString('es-MX')}</div>
          </div>
          <button class="btn-danger btn-sm" onclick="cerrar(${s.id})">Cerrar</button>
        </div>`).join('');
    } catch(err){ wrap.innerHTML = `<p style="color:var(--danger)">${err.message}</p>`; }
  }

  async function cerrar(id) {
    try {
      await del(`/auth/sesiones/${id}`);
      toast('Sesión cerrada.','success');
      load();
    } catch(err){ toast(err.message,'error'); }
  }
  load();
</script>
</body></html>
